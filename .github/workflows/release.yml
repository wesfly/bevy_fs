name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  BIN_NAME: kestrel
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          stage="${BIN_NAME}-${{ matrix.target }}"
          rm -rf "$stage" "$stage.zip"
          mkdir -p "$stage"

          # Copy the tracked source tree into the staging dir.
          git checkout-index -a --prefix="$stage/"

          # Put the compiled binary at the ROOT of that tree, right next
          # to ./assets, so it can run in place with no extra setup.
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" "$stage/${BIN_NAME}${{ matrix.ext }}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$stage.zip" "$stage" >/dev/null
          else
            zip -r "$stage.zip" "$stage" >/dev/null
          fi

          echo "ASSET=$stage.zip" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            Download the zip for your platform, extract it, and run the
            `kestrel` executable sitting at the top of the extracted
            folder. On macOS/Linux, mark it executable first:
            `chmod +x kestrel`
          files: |
            ${{ env.ASSET }}
