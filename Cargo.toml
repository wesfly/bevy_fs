[package]
name = "bevy_fs"
version = "0.1.1-dev"
license-file = "LICENSE.md"
readme = "README.md"
edition = "2024"

[dependencies]
avian3d = "0.6.1"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_dev_tools",
    "3d",
] }
chrono = "0.4.44"
image = { version = "0.25.10", features = ["webp"] }
once_cell = "1.21.4"
reqwest = { version = "0.13.1", features = ["blocking"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3
