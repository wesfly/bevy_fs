#:schema https://www.schemastore.org/cargo.json

[package]
name = "bevy_fs"
version = "0.3.0"
license-file = "LICENSE.md"
readme = "README.md"
edition = "2024"

[dependencies]
avian_fdm = { version = "0.2.0" }
avian3d = "0.7"
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_dev_tools",
    "ui",
    "3d",
] }
chrono = "0.4"
image = { version = "0.25", features = ["webp"] }
once_cell = "1.21"
reqwest = { version = "0.13" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3
