[package]
name = "bevy_fs"
version = "0.2.0"
license-file = "LICENSE.md"
readme = "README.md"
edition = "2024"

[dependencies]
avian_fdm = { git = "https://github.com/viccuad/avian_fdm.git", tag = "v0.1.0" }
avian3d = "0.6"
bevy = { version = "0.18", default-features = false, features = [
    "bevy_dev_tools",
    "3d",
] }
chrono = "0.4"
image = { version = "0.25", features = ["webp"] }
once_cell = "1.21"
reqwest = { version = "0.13" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3
