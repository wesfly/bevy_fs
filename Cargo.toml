[package]
name = "bevy_fs"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
readme = "README.md"

[dependencies]
avian3d = "0.6.0-rc.1"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_dev_tools",
    "mesh_picking",
    "3d",
] }
reqwest = { version = "0.13.1", features = ["blocking"] }
serde = "1.0.228"
serde_json = "1.0.149"

[profile.dev.package."*"]
opt-level = 3
