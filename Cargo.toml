#:schema https://www.schemastore.org/cargo.json

[package]
name = "bevy_fs"
version = "0.3.0"
edition = "2024"
license-file = "LICENSE.md"

[dependencies]
avian_fdm = { version = "0.2.0", default-features = false, features = ["f64"] }
bevy = {
  version = "0.19.0",
  default-features = false,
  features = [
    "3d",
    "bevy_dev_tools",
    "ui",
    "free_camera",
  ]
}
chrono = "0.4.45"
image = { version = "0.25.10", features = ["default-formats", "rayon", "webp"] }
once_cell = "1.21.4"
reqwest = { version = "0.13.4" }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
big_space = { git = "https://github.com/wesfly/big_space" }
dashmap = "6.2.1"
futures = "0.3.32"
avian3d = { version = "0.7.0", default-features = false, features = ["f64", "3d", "parry-f64", "xpbd_joints", "bevy_picking", "collider-from-mesh"] }

[lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
